# Cloudflare Pages project configuration.
#
# The Pages project's "root directory" is this folder (web/), so the build output
# directory is the folder itself: the site is plain static files with no build step.
#
# Wrangler resolves this file from the *current* directory, so from the repo root pass
# the project name explicitly; from inside web/ it is read and the flag is redundant.
#
#   npx wrangler pages dev web --port 8788                        # local, repo root
#   npx wrangler pages deploy web --project-name scroll-the-quran # repo root
#   cd web && npx wrangler pages deploy .                         # reads this file
name = "scroll-the-quran"
compatibility_date = "2026-09-12"
pages_build_output_dir = "."
