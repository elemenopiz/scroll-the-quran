name: ScrollTheQuran

options:
  bundleIdPrefix: com.scrollthequran
  minimumXcodeGenVersion: "2.46.0"
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  ScrollKit:
    path: Packages/ScrollKit

targets:
  ScrollTheQuran:
    type: application
    platform: iOS
    sources:
      - path: App
      # The widget's own views, compiled into the app as well, so `--screenshot
      # widget-gallery` renders the real thing instead of a copy of it. The extension's
      # entry points (`VerseWidgetBundle`, `VerseWidget`) stay out of the app target.
      - path: Widget/Shared
      - path: Content
        type: folder
        buildPhase: resources
      # Bundled OFL faces, flat at the app bundle root so UIAppFonts resolves them.
      # They live once in the repo, inside the DesignSystem target that owns them.
      - path: Packages/ScrollKit/Sources/DesignSystem/Resources/Fonts
        buildPhase: resources
        includes: ["*.ttf"]
        createIntermediateGroups: false
    dependencies:
      - package: ScrollKit
        product: AppShell
      - target: ScrollTheQuranWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quranscroller.app
        PRODUCT_NAME: ScrollTheQuran
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ScrollTheQuran.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets:
        - ScrollTheQuranUITests
      gatherCoverageData: false
      environmentVariables:
        - variable: SCROLL_FIXED_DATE
          value: "2026-09-14"
          isEnabled: false
      storeKitConfiguration: Config/ScrollTheQuran.storekit

  ScrollTheQuranWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Content
        type: folder
        buildPhase: resources
    dependencies:
      - package: ScrollKit
        product: QuranData
      - package: ScrollKit
        product: DesignSystem
      # `Prefs.widgetVerseRef` is read out of the App Group container.
      - package: ScrollKit
        product: UserState
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quranscroller.app.widget
        PRODUCT_NAME: ScrollTheQuranWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/ScrollTheQuranWidget.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  ScrollTheQuranUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ScrollTheQuran
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quranscroller.app.uitests
        TEST_TARGET_NAME: ScrollTheQuran
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
